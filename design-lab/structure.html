<!doctype html>
<html lang="en" data-q="tabs" data-v="current" data-screen="inbox" data-theme="paper" data-cmp="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doubletake — structure options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Structure lab. Soft Paper + Figtree, fixed. Each question renders its options
   side by side at phone width. Nothing here is meant for the app yet.
   ========================================================================= */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --font-ui:"Figtree",system-ui,sans-serif;
  --font-prose:var(--font-ui);
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --bg:#f8f4ea; --surface:#fffdf7; --surface-2:#f2ecdd; --surface-3:#eae1ce;
  --line:#e7e1d2; --line-strong:#cfc5ae;
  --text:#1e1b16; --muted:#6d675c;
  --accent:#b0472c; --accent-text:#9c3d25; --accent-soft:rgba(176,71,44,.11);
  --accent-2:#7d5a10;
  --ok:#2f7a3d; --warn:#9a6a00; --err:#b3261e;
  --r-xs:10px; --r-sm:12px; --r-md:18px; --r-lg:24px;
  --shadow:0 10px 30px -14px rgba(60,45,30,.20), 0 2px 6px -3px rgba(60,45,30,.08);
  --shadow-lift:0 20px 44px -18px rgba(60,45,30,.26);
  --gutter:22px; --measure:64ch;
  --tap:44px; --dur:180ms; --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="ink"]{
  --bg:#17130e; --surface:#201b15; --surface-2:#282218; --surface-3:#100d09;
  --line:#372f24; --line-strong:#4f4636;
  --text:#eee8db; --muted:#a89d8b;
  --accent:#e8865f; --accent-text:#f2a984; --accent-soft:rgba(232,134,95,.16);
  --accent-2:#e2b53c; --ok:#6ccf7b; --warn:#e2b53c; --err:#ff7b6e;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6), 0 2px 6px -3px rgba(0,0,0,.4);
  --shadow-lift:0 20px 44px -18px rgba(0,0,0,.66);
}

body{
  font-family:var(--font-ui); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.55; letter-spacing:-.004em;
  -webkit-font-smoothing:antialiased; transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}

/* ============================ LAB CHROME ============================ */
.lab{position:sticky;top:0;z-index:99;background:#151210;color:#f2ecdf;border-bottom:1px solid #2b2620}
.lab-in{max-width:1480px;margin:0 auto;padding:9px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lab-brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#c9bfa9}
.seg{display:flex;background:#221e19;border-radius:999px;padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;color:#b6ac99;font:inherit;font-size:12px;font-weight:600;
  padding:6px 11px;border-radius:999px;cursor:pointer;transition:all var(--dur) var(--ease);white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:#f2ecdf;color:#1b1712}
.seg button:hover:not([aria-pressed="true"]){color:#eee6d6}
.vr{width:1px;height:22px;background:#3a342c;margin:0 4px}

.stage{max-width:1480px;margin:0 auto;padding:26px 20px 90px}
.hero-note{max-width:74ch;margin:0 0 18px;font-size:14.5px;color:var(--muted);line-height:1.6}
.hero-note b{color:var(--text);font-weight:600}
.locked{max-width:74ch;margin:0 0 26px;padding:10px 14px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-text);font-size:12.5px;line-height:1.5}
.locked b{text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;margin-right:8px}

/* phone shell */
.frames{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.frame-cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.frame-cap b{color:var(--text);font-weight:700;letter-spacing:.04em}
.phone{
  width:392px;flex:none;border-radius:44px;padding:10px;
  background:linear-gradient(160deg,#2a2622,#171412);
  box-shadow:0 30px 60px -26px rgba(30,22,12,.5),inset 0 0 0 1.5px #3b352e;
}
.phone-screen{border-radius:35px;overflow:hidden;background:var(--surface);height:820px;display:flex;flex-direction:column;position:relative}

/* desktop shell */
.desk{
  flex:1;min-width:640px;border-radius:18px;overflow:hidden;background:var(--bg);
  box-shadow:0 30px 70px -34px rgba(30,22,12,.4),inset 0 0 0 1px var(--line);
  display:flex;height:820px;position:relative;
}
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden}
.page{padding:var(--gutter) var(--gutter) 40px;max-width:820px}
.desk .page{max-width:780px;margin:0 auto;padding:34px 34px 60px}

/* nav */
.nav{flex:none;display:flex;flex-direction:column;gap:4px;padding:18px 12px;width:216px}
.desk .nav{border-right:1px solid var(--line);padding:22px 14px}
.nav-brand{display:flex;align-items:center;gap:9px;padding:8px 10px 20px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.nav-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.nav-mark svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--muted);font-size:14px;font-weight:500;text-decoration:none;transition:all var(--dur) var(--ease)}
.nav-item svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav-item:hover{color:var(--text);background:var(--surface-2)}
.nav-item[aria-current="page"]{color:var(--text);font-weight:600;background:var(--surface)}
.nav-add{margin:auto 0 0;display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;text-decoration:none}
.nav-add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.nav-sub{display:flex;flex-direction:column;gap:1px;padding-left:30px}
.nav-sub a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:var(--r-xs)}
.nav-sub a[aria-current="page"]{color:var(--accent-text);font-weight:600;background:var(--accent-soft)}

/* phone tab bar + fab */
.tabbar{display:flex;flex:none;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--surface)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);text-decoration:none;font-weight:500;padding:4px 0}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--accent-text);font-weight:600}
.fab{position:absolute;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);border:0;display:grid;place-items:center;box-shadow:0 12px 26px -10px rgba(120,45,25,.6);cursor:pointer;z-index:3}
.fab svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round}

/* header search */
.hdr{display:flex;align-items:center;gap:10px;padding:10px var(--gutter);border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.hdr .h-title{font-size:15px;font-weight:650;letter-spacing:-.015em;flex:none}
.hdr .input{height:36px;font-size:13.5px;flex:1;min-width:0}
.hdr .hbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.hdr .hbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.kbd{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* type */
h1.page-title{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
h2.section{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:26px 0 10px}
.prose{font-family:var(--font-prose);max-width:var(--measure);font-size:17.5px;line-height:1.62}
.prose p{margin:0 0 1.05em}
.prose h3{font-family:var(--font-ui);font-size:19px;font-weight:650;letter-spacing:-.018em;margin:1.7em 0 .55em}
.mono{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:var(--r-sm);border:1px solid transparent;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:all var(--dur) var(--ease);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -8px var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.icon{width:44px;padding:0;background:transparent;color:var(--muted);border-color:transparent}
.btn.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.input{width:100%;height:44px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit;font-size:14.5px}
.input::placeholder{color:var(--muted)}
.searchbar{display:flex;align-items:center;gap:10px}
.searchbar .input{padding-left:40px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='%236d675c' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>");background-repeat:no-repeat;background-position:14px center}

.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:500;color:var(--muted)}
.chip.tag{background:var(--accent-soft);border-color:transparent;color:var(--accent-text);font-family:var(--font-mono);font-size:11px;letter-spacing:.02em}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;font-family:var(--font-mono)}

/* list */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.list.flat{box-shadow:none}
.row{display:flex;gap:13px;align-items:flex-start;padding:14px 16px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);transition:background var(--dur) var(--ease)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row-glyph{width:30px;height:30px;border-radius:var(--r-xs);display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted);margin-top:1px}
.row-glyph svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row-body{flex:1;min-width:0}
.row-title{font-size:15.5px;font-weight:550;letter-spacing:-.011em;line-height:1.3;margin-bottom:4px}
.row-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.row-trail{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.row-age{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.phone .row-meta{gap:5px}
.phone .chip.tag{height:23px;padding:0 7px;font-size:10px;letter-spacing:0}
.phone .chip{height:29px;padding:0 10px;font-size:12px}

/* answer */
.answer-title{font-size:26px;font-weight:700;letter-spacing:-.026em;line-height:1.16;margin:10px 0 12px;max-width:22ch}
.answer-metabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.clip{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);margin-bottom:26px;color:inherit;text-decoration:none}
.clip-thumb{width:52px;height:52px;border-radius:var(--r-xs);flex:none;background:linear-gradient(150deg,#3a3128,#241f19);display:grid;place-items:center;color:#c4b9a5}
.clip-thumb svg{width:20px;height:20px;fill:currentColor}
.clip-title{font-size:13.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.clip-url{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34ch}
.phone .clip-title{font-size:12.5px}
.phone .clip-tags{flex-basis:100%;display:flex;gap:5px;flex-wrap:wrap;padding-top:6px}
.body-rail{display:flex;gap:16px;align-items:flex-start}
.rail{width:3px;border-radius:2px;background:color-mix(in srgb, var(--accent) 42%, transparent);flex:none;align-self:stretch;min-height:340px}
.answer-body{flex:1;min-width:0}
.answer-metabar a{margin-left:auto;color:var(--accent-text);text-decoration:none;border-bottom:1px dotted var(--line-strong);padding-bottom:1px;text-transform:uppercase;letter-spacing:.08em}
.callout{padding:14px 16px;border-radius:var(--r-md);background:var(--surface-2);margin:22px 0}
.callout p{margin:0;font-size:15.5px;line-height:1.55}
table.cmp{width:100%;border-collapse:collapse;font-family:var(--font-ui);font-size:13.5px;margin:14px 0 6px}

/* ------------------------------------------------------------------ minimal answer
   The answer page cut down to one source line, one title, two sentences and one detail
   row. Nothing here is a card except where the thing being shown is a list. */
.m-source{display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.m-source svg{width:13px;height:13px;fill:currentColor;flex:none;opacity:.75}
.m-source .sep{opacity:.5}
.m-title{font-size:24px;font-weight:700;letter-spacing:-.028em;line-height:1.18;margin:0 0 16px;max-width:24ch;text-wrap:balance}
.m-lede{font-size:18px;font-weight:600;letter-spacing:-.017em;line-height:1.38;margin:0 0 12px;max-width:var(--measure);text-wrap:pretty}
.m-lede.lg{font-size:22px;letter-spacing:-.022em;line-height:1.3;font-weight:650}
.m-para{font-family:var(--font-prose);font-size:16.5px;line-height:1.62;margin:0 0 22px;max-width:var(--measure);color:var(--text)}
.m-lede + .m-para{color:var(--muted)}
.m-detail{display:flex;align-items:center;gap:7px;min-height:48px;width:100%;margin-top:6px;padding-top:14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;font-family:var(--font-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.m-detail .n{color:var(--accent-text)}
.m-detail .sep{opacity:.5}
.m-detail svg{width:14px;height:14px;margin-left:auto;fill:none;stroke:var(--line-strong);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.m-note{display:flex;gap:7px;align-items:baseline;margin:-12px 0 22px;padding-left:8px;border-left:2px solid var(--accent-soft);font-family:var(--font-ui);font-size:12px;line-height:1.45;color:var(--muted)}
.m-note .n{font-family:var(--font-mono);font-size:10px;color:var(--accent-text);flex:none}
.m-note .verdict{height:16px;padding:0 5px;font-size:8.5px;flex:none}
.verdict{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;font-family:var(--font-ui);font-size:9.5px;font-weight:650;letter-spacing:.02em;text-transform:lowercase;background:var(--surface-2);color:var(--muted);flex:none}
.verdict.true{background:color-mix(in srgb, var(--ok) 13%, transparent);color:var(--ok)}
.verdict.false{background:color-mix(in srgb, var(--err) 13%, transparent);color:var(--err)}
.verdict.mixed{background:color-mix(in srgb, var(--warn) 15%, transparent);color:var(--warn)}
.verdict.unverified{background:var(--surface-2);color:var(--muted)}
.m-rail{display:flex;gap:14px;align-items:stretch}
.m-rail .rail{width:2px;min-height:0}

table.cmp{width:100%;border-collapse:collapse;font-family:var(--font-ui);font-size:13.5px;margin:14px 0 6px}
table.cmp th,table.cmp td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
table.cmp th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.cmp td:first-child{color:var(--muted)}
table.cmp tr:last-child td{border-bottom:0}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:32px}
.tabs button{border:0;background:transparent;font:inherit;font-size:13.5px;font-weight:550;color:var(--muted);padding:11px 12px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);padding:1px 5px;border-radius:5px}
.sec-block{margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.sec-block h3{font-size:16px;font-weight:650;letter-spacing:-.015em;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.sec-block h3 .n{font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--muted);background:var(--surface-2);padding:1px 6px;border-radius:5px}

/* answer detail, four placements */
.ans-turn + .ans-turn{margin-top:30px;padding-top:26px;border-top:1px solid var(--line)}
.tabs.turn-tabs{margin-top:20px}
.fold{margin-top:24px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
.fold-head{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;padding:13px 15px;font-size:13.5px;font-weight:600;color:var(--text);background:transparent;border:0;font-family:inherit;width:100%;text-align:left;cursor:pointer;white-space:nowrap}
.fold-head svg{order:1;width:15px;height:15px;margin-left:auto;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transform:rotate(90deg)}
.fold-head .counts{order:2;flex-basis:100%;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.fold-body{padding:2px 15px 14px;border-top:1px solid var(--line)}
.fold-body .sec-block{margin-top:16px;padding-top:14px}
.fold-body .sec-block:first-child{margin-top:14px;padding-top:0;border-top:0}
/* Margin notes: a real right-hand column in the desktop frame, inline chips after each
   paragraph in the phone frame, since 390 px has no margin to write in. Scoped by frame
   class, not a media query, because the frames are mocks inside one viewport. */
.marginal{display:block}
.desk .marginal{display:grid;grid-template-columns:minmax(0,1fr) 210px;column-gap:26px;align-items:start}
.margin-col{padding-top:6px;display:none}
.desk .margin-col{display:block}
.mnote{margin-bottom:16px;font-size:12px;line-height:1.45;color:var(--muted);display:flex;gap:7px;align-items:baseline}
.mnote .n{font-family:var(--font-mono);font-size:10px;color:var(--accent-text);flex:none}
.mnote .verdict{height:17px;padding:0 5px;font-size:9.5px;margin-left:auto;flex:none}
.mnote-inline{display:flex;gap:8px;align-items:baseline;margin:-2px 0 18px;padding:7px 11px;border-radius:var(--r-xs);background:var(--surface-2);font-size:12px;line-height:1.4;color:var(--muted)}
.mnote-inline .n{font-family:var(--font-mono);font-size:10px;color:var(--accent-text);flex:none}
.mnote-inline .verdict{height:16px;padding:0 5px;font-size:9px;margin-left:auto;flex:none}
.desk .mnote-inline{display:none}
.ref-mark{font-family:var(--font-mono);font-size:9px;color:var(--accent-text);vertical-align:super;text-decoration:none;padding:0 1px}

/* A dock above the composer: the detail panel grows up out of the tab bar, the bar never
   moves. One tap from anywhere on the page to the claims, and the prose stays behind it. */
.detail-dock{position:absolute;left:0;right:0;bottom:112px;z-index:3;background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -14px 40px -22px rgba(30,22,12,.4)}
.dock-head{display:flex;align-items:baseline;gap:9px;padding:11px 16px 9px}
.dock-head h3{font-size:14px;font-weight:650;letter-spacing:-.015em}
.dock-head .meta{margin-left:auto}
.dock-grab{width:34px;height:4px;border-radius:2px;background:var(--line-strong);margin:7px auto 0}
.dock-body{padding:0 16px 10px;max-height:214px;overflow-y:auto}

/* The pinned detail bar itself. */
.pin-bar{position:absolute;left:0;right:0;bottom:67px;z-index:4;display:flex;gap:2px;border-top:1px solid var(--line);background:var(--surface);padding:0 8px}
.pin-bar button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:550;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.pin-bar button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.pin-bar .n{font-family:var(--font-mono);font-size:10px;color:var(--muted);background:var(--surface-2);padding:1px 5px;border-radius:5px}

/* D on desktop: there is room for the dock to stay open beside the prose instead of
   covering it. The pinned bar becomes the rail's header, the dock its body, and the
   absolute offsets that make it a bottom dock on the phone are dropped. */
.eachturn-wrap{display:block}
.eachturn-rail{display:contents}
.desk .page-wide{max-width:1010px}
.desk .eachturn-wrap{display:grid;grid-template-columns:minmax(0,1fr) 268px;column-gap:26px;align-items:start}
.desk .eachturn-rail{display:flex;flex-direction:column;position:sticky;top:18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.desk .eachturn-rail .pin-bar{order:-1;position:static;padding:0 4px;border-top:0;border-bottom:1px solid var(--line);background:transparent}
.desk .eachturn-rail .pin-bar button{font-size:11.5px;min-height:40px;padding:0 2px}
.desk .eachturn-rail .detail-dock{position:static;border-radius:0;background:transparent;box-shadow:none}
.desk .eachturn-rail .dock-grab{display:none}
.desk .eachturn-rail .dock-head{display:none}
.desk .eachturn-rail .dock-body{max-height:none;overflow:visible;padding-bottom:12px}

/* claims, expanded, for the per-turn and folded variants */
.claim-line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.claim-line:last-child{border-bottom:0}
.claim-line .verdict{height:18px;padding:0 6px;font-size:9.5px;margin-top:1px}
.thing-line{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13.5px}
.thing-line .row-glyph{width:24px;height:24px;margin:0}
.src-line{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);padding:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Sticky to the bottom of the frame, as FollowUp is in the app, so the follow-up field is
   always in reach and the answer variants are judged against the real chrome. */
.composer{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px var(--gutter);border-top:1px solid var(--line);background:var(--surface);flex:none}
.composer .input{border-radius:999px;height:42px}
.send{width:42px;height:42px;border-radius:50%;background:var(--accent);border:0;display:grid;place-items:center;flex:none;cursor:pointer}
.send svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* library */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px;text-decoration:none;color:inherit;transition:all var(--dur) var(--ease);box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.tile-icon{width:26px;height:26px;color:var(--accent-text)}
.tile-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile-foot{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile-label{font-size:14px;font-weight:600}
.tile-count{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.todo-pin{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--accent-soft);border:1px solid transparent;color:inherit;text-decoration:none;margin-bottom:18px}
.todo-pin .row-glyph{background:transparent;color:var(--accent-text)}
.hub{display:grid;gap:14px;margin-top:8px}
.hub-card{display:flex;gap:15px;align-items:center;padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit}
.hub-card .tile-icon{width:34px;height:34px;flex:none;color:var(--accent-text)}
.hub-card h3{font-size:17px;font-weight:650;letter-spacing:-.018em;margin-bottom:3px}
.hub-card p{font-size:13px;color:var(--muted);line-height:1.45}
.hub-card .go{margin-left:auto;color:var(--line-strong);flex:none;width:18px;height:18px}
.hub-card .go svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8}
.subnav{display:flex;gap:6px;margin-bottom:20px}
.subnav a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line)}
.subnav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* settings + compose */
.sgroup{margin-bottom:22px}
.sgroup-title{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);font-weight:700;margin:0 0 8px}
.sgroup-body{border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.srow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:14.5px;min-height:52px}
.srow:last-child{border-bottom:0}
.srow-icon{width:20px;height:20px;color:var(--muted);flex:none}
.srow-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.srow-text{flex:1;min-width:0}
.srow-label{font-weight:500}
.srow-hint{font-size:12px;color:var(--muted);margin-top:1px}
.srow-value{font-size:13px;color:var(--muted);font-family:var(--font-mono)}
.srow-chev{width:16px;height:16px;color:var(--line-strong);flex:none}
.srow-chev svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
.field .input{height:auto;padding:12px 14px;min-height:100px;resize:none;line-height:1.5;font-size:15px}
.segmented{display:flex;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;gap:2px}
.segmented button{flex:1;border:0;background:transparent;font:inherit;font-size:13px;font-weight:550;color:var(--muted);padding:9px 0;border-radius:calc(var(--r-sm) - 3px);cursor:pointer}
.segmented button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* palette mock */
.palette{position:absolute;inset:0;background:rgba(28,27,24,.58);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding-top:70px;z-index:4}
.palette-box{width:86%;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 30px 60px -24px rgba(30,22,12,.5);overflow:hidden}
.palette-box .input{height:50px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding-left:42px;font-size:15px;outline:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='17' height='17' viewBox='0 0 24 24' fill='none' stroke='%236d675c' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-4-4'/></svg>");background-repeat:no-repeat;background-position:15px center}
.palette-list{display:flex;flex-direction:column}
.palette-list a{display:flex;gap:11px;align-items:center;padding:11px 16px;text-decoration:none;color:inherit;font-size:13.5px;border-bottom:1px solid var(--line)}
.palette-list a:last-child{border-bottom:0}
.palette-list .row-glyph{width:24px;height:24px;margin:0}
.palette-foot{font-size:11px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line);display:flex;gap:14px}

/* compare row */
#compareWrap{display:none;gap:26px;flex-wrap:wrap;align-items:flex-start}
html[data-cmp="on"] #singleWrap{display:none}
html[data-cmp="on"] #compareWrap{display:flex}
#compareWrap .phone{transform:none;width:342px}
#compareWrap .phone-screen{height:700px}
#compareWrap .frame-cap{margin-bottom:8px}
#compareWrap .page{padding:18px 18px 30px}
#compareWrap .answer-title{font-size:23px}
#compareWrap .page-title{font-size:24px}

@media (max-width:900px){
  .desk{display:none}
  .frames{justify-content:center}
  .phone{width:100%;max-width:392px}
}

      {id:'trimmed', label:'A · Trimmed, same shape', screen:'answer'},
      {id:'bare', label:'B · No generated title', screen:'answer'},
      {id:'ledefirst', label:'C · The answer leads', screen:'answer'},
      {id:'inline', label:'D · Claims inline, no detail chrome', screen:'answer'},
    ],
  },
};

const state = { q:'tabs', v:'current', screen:'inbox', theme:'paper', cmp:'off' };

// Deep links: ?q=library&v=hub&screen=library&theme=ink&cmp=on. Screenshots and shared
// links need this; the toolbar is the same state.
(function seedFromUrl(){
  const p = new URLSearchParams(location.search);
  const q = p.get('q'), v = p.get('v'), screen = p.get('screen');
  const theme = p.get('theme'), cmp = p.get('cmp');
  if (q && QUESTIONS[q]) {
    state.q = q;
    state.v = QUESTIONS[q].variants[0].id;
    state.screen = QUESTIONS[q].screens[0];
  }
  if (v && QUESTIONS[state.q].variants.some(x => x.id === v)) state.v = v;
  if (screen && QUESTIONS[state.q].screens.includes(screen)) state.screen = screen;
  else {
    const variant = QUESTIONS[state.q].variants.find(x => x.id === state.v);
    if (variant && QUESTIONS[state.q].screens.includes(variant.screen)) state.screen = variant.screen;
  }
  if (theme === 'paper' || theme === 'ink') state.theme = theme;
  if (cmp === 'on' || cmp === 'off') state.cmp = cmp;
})();

function writeUrl(){
  const p = new URLSearchParams({ q: state.q, v: state.v, screen: state.screen, theme: state.theme, cmp: state.cmp });
  history.replaceState(null, '', `${location.pathname}?${p}`);
}

/* ------------------------------------------------------------------ chrome */
/** The answer already given for a question, if it has one. The chrome follows these
 *  everywhere else, so an open question is judged against the settled app. */
function settledVariant(qid){
  if (state.q === qid) return state.v;
  const q = QUESTIONS[qid];
  return q && q.settledV ? q.settledV : null;
}

function tabSet(){
  const tabsVariant = settledVariant('tabs') ?? 'current';
  if (tabsVariant === 'todo') {
    return [
      {id:'inbox', label:'Inbox', icon:'inbox', to:'/'},
      {id:'todo', label:'To do', icon:'todo', to:'/todo'},
      {id:'library', label:'Library', icon:'library', to:'/library'},
      {id:'settings', label:'Settings', icon:'settings', to:'/settings'},
    ];
  }
  if (tabsVariant === 'three') {
    return [
      {id:'inbox', label:'Inbox', icon:'inbox', to:'/'},
      {id:'library', label:'Library', icon:'library', to:'/library'},
      {id:'settings', label:'Settings', icon:'settings', to:'/settings'},
    ];
  }
  return [
    {id:'inbox', label:'Inbox', icon:'inbox', to:'/'},
    {id:'library', label:'Library', icon:'library', to:'/library'},
    {id:'compose', label:'Add', icon:'plus', to:'/compose'},
    {id:'settings', label:'Settings', icon:'settings', to:'/settings'},
  ];
}

function hasFab(){
  const tabsVariant = settledVariant('tabs') ?? 'current';
  return tabsVariant !== 'current';
}

function searchMode(){
  return settledVariant('search') ?? 'inbox';
}

function tabbarHtml(active){
  const tabs = tabSet();
  const addAsTab = tabs.some(t => t.id === 'compose');
  return `<nav class="tabbar" aria-label="Primary">${
    tabs.map(t => `<a href="#"${t.id === active ? ' aria-current="page"' : ''}>${SVG[t.icon]}${t.label}</a>`).join('')
  }</nav>${addAsTab ? '' : '<button type="button" class="fab" aria-label="Add">' + SVG.plus + '</button>'}`;
}

function navHtml(active){
  const tabs = tabSet();
  const addAsTab = tabs.some(t => t.id === 'compose');
  return `<nav class="nav" aria-label="Primary">
    <div class="nav-brand"><span class="nav-mark"><svg viewBox="0 0 24 24"><path d="M9 3h8a2 2 0 0 1 2 2v10M5 7h9a2 2 0 0 1 2 2v12H7a2 2 0 0 1-2-2z"/></svg></span>Doubletake</div>
    ${tabs.map(t => `<a class="nav-item" href="#"${t.id === active ? ' aria-current="page"' : ''}>${SVG[t.icon]}${t.label}</a>`).join('')}
    ${addAsTab ? '' : `<a class="nav-add" href="#">${SVG.plus}Add</a>`}
  </nav>`;
}

function headerHtml(){
  const mode = searchMode();
  if (mode === 'header') {
    return `<div class="hdr"><span class="h-title">Doubletake</span><input class="input" placeholder="Search everything"><span class="kbd">⌘K</span></div>`;
  }
  if (mode === 'palette') {
    return `<div class="hdr"><span class="h-title">Doubletake</span><span style="flex:1"></span><button type="button" class="hbtn" aria-label="Search">${SVG.search}</button></div>`;
  }
  return '';
}

SCREENS.answer = () => {
  const v = state.q === 'answer' ? state.v : 'trimmed';

  const lede = 'The Osmo Pocket 3 is the better travel camera for most people.';
  const para = 'The Ace Pro 2 only wins if you mostly shoot action or in the rain. Walking, talking and food are exactly the cases where a gimbal beats a crop.';

  const sep = '<span class="sep">·</span>';
  const source = (extra = '') => `<div class="m-source">${SVG.play}<span>youtube</span>${extra}</div>`;
  const counts = `<span>2 claims</span>${sep}<span>2 things</span>${sep}<span>2 sources</span>`;
  const title = '<h1 class="m-title">Osmo Pocket 3 vs Insta360 Ace Pro 2 for travel</h1>';

  const detail = `<button type="button" class="m-detail">${counts}${SVG.chev}</button>`;
  const note = (n, text, verdict) => `<div class="m-note"><span class="n">${n}</span><span>${text}</span><span class="verdict ${verdict}">${verdict}</span></div>`;

  // A. trimmed: the same page with the repeated chrome and the extra copy taken out
  const trimmed = `<div class="page">
    ${source()}
    ${title}
    <p class="m-para"><b>${lede}</b> ${para}</p>
    ${detail}
  </div>`;

  // B. bare: no generated title at all, everything the page knows on one line at the top
  const bare = `<div class="page">
    ${source(`${sep}${counts}`)}
    <p class="m-lede">${lede}</p>
    <p class="m-para">${para}</p>

  const ledefirst = `<div class="page">

  const body = { trimmed, bare, ledefirst, inline }[v] ?? trimmed;
  return `${body}
  <div class="composer"><input class="input" placeholder="Ask a follow-up…"><button type="button" class="send" aria-label="Send">${SVG.send}</button></div>`;
};

/* ------------------------------------------------------------------ render */
const phoneScreen = document.getElementById('phoneScreen');
const deskShell = document.getElementById('deskShell');

function renderSingle(){
  const q = QUESTIONS[state.q];
  const activeScreen = q.screens.includes(state.screen) ? state.screen : q.screens[0];
  state.screen = activeScreen;
  const html = SCREENS[activeScreen]();

  const showTabbar = activeScreen !== 'answer';
  const showFab = hasFab() && showTabbar;
  phoneScreen.innerHTML = `${headerHtml()}<div class="main scroll">${html}</div>${
    showTabbar ? tabbarHtml(activeScreen) : ''
  }${showFab ? `<button type="button" class="fab" aria-label="Add">${SVG.plus}</button>` : ''}`;

  deskShell.innerHTML = `${navHtml(activeScreen)}<div class="main scroll">${headerHtml()}${html}</div>`;
  // The desktop header sits inside the scrolling column; wrap it so it spans the width.
  const hdr = deskShell.querySelector('.main > .hdr');
  if (hdr) hdr.style.margin = '0 -34px 0';

  document.getElementById('heroNote').innerHTML = q.note;
  const locked = document.getElementById('locked');
  const settled = [
    QUESTIONS.tabs.settled && `Tabs: ${QUESTIONS.tabs.settled}`,
    QUESTIONS.search.settled && `Search: ${QUESTIONS.search.settled}`,
    QUESTIONS.library.settled && `Library: ${QUESTIONS.library.settled}`,
  ].filter(Boolean);
  locked.hidden = settled.length === 0;
  locked.innerHTML = `<b>Settled</b>${settled.join(' &nbsp;·&nbsp; ')}`;
  document.getElementById('capPhone').innerHTML = `Phone · 390 · <b>${QUESTIONS[state.q].label}</b>`;
  document.getElementById('capDesk').innerHTML = 'Desktop · 1280';
}

function renderCompare(){
  const q = QUESTIONS[state.q];
  document.getElementById('compareWrap').innerHTML = q.variants.map(v => {
    const saved = { v: state.v, screen: state.screen };
    state.v = v.id; state.screen = v.screen;
    const html = SCREENS[v.screen] ? SCREENS[v.screen]() : '';
    const active = v.screen;
    const showTabbar = active !== 'answer';
    const inner = `${headerHtml()}<div class="main scroll">${html}</div>${
      showTabbar ? tabbarHtml(active) : ''
    }${hasFab() && showTabbar ? `<button type="button" class="fab" aria-label="Add">${SVG.plus}</button>` : ''}`;
    state.v = saved.v; state.screen = saved.screen;
    return `<div><div class="frame-cap">${v.label}</div>
      <div class="phone"><div class="phone-screen">${inner}</div></div></div>`;
  }).join('');
}

function syncSegments(){
  document.querySelectorAll('#segQ button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.q === state.q));
  });
  const variants = QUESTIONS[state.q].variants;
  const segV = document.getElementById('segV');
  segV.innerHTML = variants.map(v => `<button type="button" data-v="${v.id}" aria-pressed="${v.id === state.v}">${v.label}</button>`).join('');
  document.querySelectorAll('#segScreen button').forEach(b => {
    const ok = QUESTIONS[state.q].screens.includes(b.dataset.screen);
    b.style.display = ok ? '' : 'none';
    b.setAttribute('aria-pressed', String(b.dataset.screen === state.screen));
  });
  document.querySelectorAll('#segTheme button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme));
  });
  document.querySelectorAll('#segCompare button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.cmp === state.cmp));
  });
  document.documentElement.dataset.q = state.q;
  document.documentElement.dataset.v = state.v;
  document.documentElement.dataset.screen = state.screen;
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.cmp = state.cmp;
}

function render(){
  syncSegments();
  renderSingle();
  if (state.cmp === 'on') renderCompare();
  // After renderSingle, which may have corrected state.screen to a screen the variant owns.
  writeUrl();
}

document.getElementById('segQ').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.q = b.dataset.q;
  state.v = QUESTIONS[state.q].variants[0].id;
  state.screen = QUESTIONS[state.q].variants[0].screen;
  render();
});
document.getElementById('segV').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.v = b.dataset.v;
  const v = QUESTIONS[state.q].variants.find(x => x.id === state.v);
  if (v) state.screen = v.screen;
  render();
});
document.getElementById('segScreen').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.screen = b.dataset.screen;
  render();
});
document.getElementById('segTheme').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.theme = b.dataset.theme;
  render();
});
document.getElementById('segCompare').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.cmp = b.dataset.cmp;
  render();
});

// Inert links inside the mock screens.
document.addEventListener('click', (e) => {
  const t = e.target.closest('a, .tabs button');
  if (t) e.preventDefault();
});

render();
</script>
