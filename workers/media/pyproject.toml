[project]
name = "doubletake-media"
version = "0.1.0"
description = "Doubletake media worker: download, transcribe, OCR, sample frames, fetch comments"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "yt-dlp>=2026.8.19",
]

[project.optional-dependencies]
# OCR (RapidOCR, ONNX on CPU). Without it the worker falls back to a `tesseract` binary.
media = ["rapidocr-onnxruntime>=1.4", "pillow>=10", "numpy>=1.26"]
whisper-mlx = ["mlx-whisper>=0.4"]          # Apple Silicon (default backend there)
whisper-cpu = ["faster-whisper>=1.1"]       # Linux / Intel
vision-local = ["mlx-vlm>=0.1"]              # DOUBLETAKE_VISION=local opt-in

[project.scripts]
doubletake-media = "doubletake_media.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doubletake_media"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
