[project]
name = "doubletake-media"
version = "0.0.0"
description = "Doubletake media worker: download, transcribe, OCR, sample frames, fetch comments"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  # Added as each milestone needs them (M3). Kept here so `uv sync` proves the toolchain.
]

[project.optional-dependencies]
# Planned M3 dependency groups — documented, not yet installed:
# media = ["yt-dlp>=2026.8.19", "rapidocr-onnxruntime", "trafilatura", "pillow", "numpy"]
# whisper-mlx = ["mlx-whisper"]            # Apple Silicon
# whisper-cpu = ["faster-whisper"]         # Linux / Intel
# vision-local = ["mlx-vlm"]               # Qwen2.5-VL / Moondream opt-in

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doubletake_media"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
